<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDBL - Salon d'Entraide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">💬</span>
      <div>
        <h1 class="font-bold text-lg text-white" id="channel-title">Salon d'Entraide Promotion</h1>
        <p class="text-xs text-slate-400">Discussion en direct avec les étudiants de votre promotion</p>
      </div>
    </div>
    <a href="dashboard.html" class="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold">← Dashboard</a>
  </header>

  <!-- CONTENEUR DU CHAT -->
  <main class="flex-1 max-w-4xl w-full mx-auto flex flex-col p-4 space-y-4">
    
    <!-- ZONE D'AFFICHAGE DES MESSAGES -->
    <div id="chat-messages" class="flex-1 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 overflow-y-auto space-y-4 max-h-[calc(100vh-220px)] shadow-inner">
      <p class="text-xs text-slate-500 text-center" id="loading-txt">Chargement du fil de discussion...</p>
    </div>

    <!-- FORMULAIRE D'ENVOI DE MESSAGE -->
    <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
      <input type="text" id="message-input" required placeholder="Posez une question ou répondez à un camarade..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500">
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 rounded-xl font-medium text-sm transition flex items-center gap-2 shrink-0">
        <span>Envoyer</span>
        <span>🚀</span>
      </button>
    </form>

  </main>

  <script src="forum.js"></script>
</body>
</html>
