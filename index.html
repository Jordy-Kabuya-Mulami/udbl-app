<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDBL Student - Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <!-- En-tête -->
    <div class="text-center space-y-2">
      <div class="inline-block p-3 bg-blue-600/10 rounded-2xl border border-blue-500/20 text-blue-400 font-bold text-2xl mb-1">
        🎓 UDBL Hub
      </div>
      <h1 class="text-xl font-bold text-white">Université Don Bosco de Lubumbashi</h1>
      <p class="text-xs text-slate-400">Plateforme d'apprentissage & espace étudiant</p>
    </div>

    <!-- Formulaire d'accès rapide -->
    <form onsubmit="rejoindreApplication(event)" class="space-y-4">
      
      <!-- Nom complet -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Nom complet</label>
        <input type="text" id="nom" required placeholder="Ex: Jean Mukendi" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 transition">
      </div>

      <!-- Promotion -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Promotion / Niveau</label>
        <select id="promotion" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 transition">
          <option value="">-- Sélectionnez votre niveau --</option>
          <option value="L1">Licence 1 (Sciences Informatiques - Tronc commun)</option>
          <option value="L2">Licence 2 (Sciences Informatiques - Tronc commun)</option>
          <option value="L3">Licence 3</option>
          <option value="L4">Licence 4 (Master)</option>
        </select>
      </div>

      <!-- Spécialité / Filière (Affichée uniquement en L3/L4) -->
      <div id="filiere-container" style="display: none;">
        <label class="block text-xs font-medium text-slate-300 mb-1">Spécialité / Filière</label>
        <select id="filiere" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 transition">
          <option value="">Chargement des spécialités...</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">
        Accéder à l'application 🚀
      </button>

    </form>

  </div>

  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Script de gestion logique -->
  <script src="auth.js"></script>

</body>
</html>
